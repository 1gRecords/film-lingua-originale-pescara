# Temporary: checks which The Space requests Cloudflare blocks from GitHub runners.
name: Diagnosi The Space

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        shell: python
        run: |
          import http.cookiejar, urllib.request, urllib.error
          from datetime import date
          UA = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36'
          FULL = {'User-Agent': UA, 'Accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8',
                  'Accept-Language': 'it-IT,it;q=0.9,en;q=0.8', 'Referer': 'https://www.thespacecinema.it/'}
          PAGE = 'https://www.thespacecinema.it/cinema/montesilvano/al-cinema'
          API = ('https://www.thespacecinema.it/api/microservice/showings/cinemas/1026/films?showingDate='
                 + date.today().isoformat() + 'T00:00:00&minEmbargoLevel=3&includesSession=true&includeSessionAttributes=true')
          opener = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(http.cookiejar.CookieJar()))
          def probe(name, url, headers):
              try:
                  with opener.open(urllib.request.Request(url, headers=headers), timeout=20) as r:
                      print(name, r.status, r.headers.get('content-type'), len(r.read()))
              except urllib.error.HTTPError as e:
                  print(name, e.code, 'cf-mitigated=', e.headers.get('cf-mitigated'), e.read(300)[:120])
              except Exception as e:
                  print(name, 'ERR', e)
          probe('home ua', 'https://www.thespacecinema.it/', {'User-Agent': UA})
          probe('page ua', PAGE, {'User-Agent': UA})
          probe('page full', PAGE, FULL)
          probe('api after page', API, {**FULL, 'Accept': 'application/json'})
          probe('api only', API, {'User-Agent': UA, 'Accept': 'application/json'})
      - name: Probe with curl
        run: |
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36'
          for u in https://www.thespacecinema.it/ https://www.thespacecinema.it/cinema/montesilvano/al-cinema; do
            curl -s -o /dev/null -w "curl %{http_code} $u\n" -A "$UA" -H 'Accept-Language: it-IT,it;q=0.9' "$u"
          done
